# JDK 17+ for Android Gradle Plugin
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# JVM Heap & Memory Optimization for Windows System Pagefile
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=4

# Kapt stability flags
kapt.use.worker.api=false
kapt.incremental.apt=false
kapt.correct.error.types=true

# AndroidX & Jetpack Compose
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
